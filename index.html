<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABTalks - 60-Day Coding Challenge Hub (Team Vitality Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(30, 41, 59, 0.75) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }
        .glass-panel-hover:hover {
            border-color: rgba(6, 182, 212, 0.4);
            box-shadow: 0 25px 50px -12px rgba(6, 182, 212, 0.15);
            transform: translateY(-3px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .text-gradient {
            background: linear-gradient(135deg, #22d3ee 0%, #818cf8 50%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .star-rating span {
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .star-rating span.active {
            color: #facc15;
        }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 antialiased selection:bg-cyan-500 selection:text-slate-950 min-h-screen flex flex-col justify-between">

    <!-- Premium Animated Background Gradients -->
    <div class="fixed top-0 left-1/4 w-[600px] h-[600px] bg-cyan-500/10 rounded-full blur-[140px] pointer-events-none animate-pulse-slow"></div>
    <div class="fixed bottom-0 right-1/4 w-[600px] h-[600px] bg-indigo-500/10 rounded-full blur-[140px] pointer-events-none animate-pulse-slow" style="animation-delay: 2s;"></div>

    <!-- NAVBAR -->
    <header class="border-b border-slate-900/80 bg-[#030712]/90 backdrop-blur-2xl sticky top-0 z-50 px-6 sm:px-12 py-4 flex justify-between items-center shadow-2xl">
        <div class="flex items-center gap-3 cursor-pointer group" onclick="router.navigateTo('/')">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-500 via-indigo-500 to-pink-500 flex items-center justify-center font-extrabold text-slate-950 text-lg shadow-lg shadow-cyan-500/25 group-hover:scale-105 transition">
                ⚡
            </div>
            <div>
                <span class="font-extrabold tracking-widest text-sm sm:text-base bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">ABTALKS</span>
                <span class="block text-[9px] text-cyan-400 font-bold tracking-widest uppercase">Team Vitality</span>
            </div>
        </div>

        <nav class="hidden md:flex items-center gap-2 bg-slate-900/60 p-1.5 rounded-2xl border border-slate-800/80">
            <button onclick="router.navigateTo('/')" id="nav-home" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">🏠 Home</button>
            <button onclick="router.navigateTo('/dashboard')" id="nav-dashboard" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">📊 Dashboard</button>
            <button onclick="router.navigateTo('/day/12')" id="nav-day" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">⚡ Day 12</button>
            <button onclick="router.navigateTo('/about')" id="nav-about" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">✨ About Us</button>
            <button onclick="router.navigateTo('/contact')" id="nav-contact" class="px-4 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">📬 Contact</button>
        </nav>

        <div class="flex items-center gap-3">
            <div id="liveClock" class="hidden sm:flex items-center gap-2 bg-slate-900/80 border border-slate-800 px-3 py-1 rounded-xl font-mono text-xs text-cyan-300 font-bold">
                <span>🕒</span> <span id="clockText">00:00:00</span>
            </div>
            <span class="text-[10px] sm:text-xs bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 px-3 py-1 rounded-full font-bold flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping"></span> 390px Mobile View
            </span>
        </div>
    </header>

    <!-- MAIN ROUTER CONTAINER (Optimized for 390px Mobile Viewport) -->
    <main id="app-router" class="flex-grow max-w-[390px] sm:max-w-7xl mx-auto w-full px-4 sm:px-12 py-8 z-10"></main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-900 bg-[#030712] py-8 px-6 sm:px-12 z-10">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center text-xs text-slate-500 gap-4 text-center sm:text-left">
            <div>© 2026 ABTalks Ecosystem. Crafted by Team : <strong class="text-cyan-400">Vitality</strong>.</div>
            <div class="flex flex-wrap justify-center gap-4">
                <a href="#/" onclick="router.navigateTo('/')" class="hover:text-cyan-400 transition font-semibold">Home</a>
                <a href="#/dashboard" onclick="router.navigateTo('/dashboard')" class="hover:text-cyan-400 transition font-semibold">Dashboard</a>
                <a href="#/day/12" onclick="router.navigateTo('/day/12')" class="hover:text-cyan-400 transition font-semibold">Day 12</a>
                <a href="#/about" onclick="router.navigateTo('/about')" class="hover:text-cyan-400 transition font-semibold">About Us</a>
                <a href="#/contact" onclick="router.navigateTo('/contact')" class="hover:text-cyan-400 transition font-semibold">Contact</a>
            </div>
        </div>
    </footer>

    <!-- APP ENGINE -->
    <script>
        const appState = {
            streakDays: 12,
            selectedTrack: 'AI & Full Stack',
            githubLink: 'https://github.com/ishaanthusoo/abtalks-challenge',
            linkedinLink: 'https://linkedin.com/posts/ishaanthusoo-day12',
            isSubmitted: true,
            synergyPoints: 600,
            dashboardTab: 'tasks',
            selectedCalendarDay: 12,
            selectedRating: 5,
            captchaNum1: 4,
            captchaNum2: 3,
            captchaInput: '',
            feedbacks: [
                { name: "Aarav Mehta", role: "Full Stack Engineer", text: "Team Vitality's mobile-first layout transformed my post-college consistency!" },
                { name: "Sneha Roy", role: "AI Student Developer", text: "Incredible 60-day challenge tracker. Perfect for recruiter visibility." }
            ],
            toastMessage: null
        };

        function showToast(msg) {
            appState.toastMessage = msg;
            render();
            setTimeout(() => { appState.toastMessage = null; render(); }, 3500);
        }

        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            const clockEl = document.getElementById('clockText');
            if (clockEl) clockEl.innerText = timeString;
        }
        setInterval(updateClock, 1000);

        const router = {
            currentRoute: '/',
            init() { 
                const path = window.location.hash.replace('#', '') || '/';
                this.currentRoute = path;
                render();
            },
            navigateTo(route) { 
                window.location.hash = route;
                this.currentRoute = route;
                render(); 
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        window.addEventListener('hashchange', () => {
            router.currentRoute = window.location.hash.replace('#', '') || '/';
            render();
        });

        // 1. LANDING PAGE (/)
        function renderLanding() {
            return `
                <div class="space-y-10 animate-fadeIn py-4">
                    <div class="glass-panel p-6 sm:p-14 rounded-[2.5rem] relative overflow-hidden text-center space-y-6 border border-cyan-500/20 shadow-2xl">
                        <div class="absolute -top-32 -right-32 w-72 h-72 bg-cyan-500/10 rounded-full blur-[90px] pointer-events-none"></div>
                        <div class="absolute -bottom-32 -left-32 w-72 h-72 bg-indigo-500/10 rounded-full blur-[90px] pointer-events-none"></div>

                        <div class="inline-flex items-center gap-2 bg-cyan-500/10 text-cyan-400 border border-cyan-500/25 px-4 py-1.5 rounded-full text-[10px] font-extrabold uppercase tracking-widest">
                            <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> Team Vitality Edition
                        </div>
                        
                        <h1 class="text-3xl sm:text-6xl font-extrabold tracking-tight text-white leading-tight">
                            Code Daily.<br>Own Your <span class="text-gradient">60-Day Streak.</span>
                        </h1>
                        
                        <p class="text-slate-300 text-xs sm:text-base leading-relaxed max-w-xl mx-auto font-medium">
                            Designed specifically for Indian college students. Turn late-night post-college hours into high-impact GitHub commits and LinkedIn visibility.
                        </p>

                        <div class="pt-2 flex flex-col gap-3">
                            <button onclick="router.navigateTo('/dashboard')" class="w-full bg-gradient-to-r from-cyan-500 to-indigo-600 text-slate-950 font-extrabold py-3.5 rounded-2xl text-xs sm:text-sm transition shadow-xl shadow-cyan-500/25">
                                Open Student Dashboard 🚀
                            </button>
                            <button onclick="router.navigateTo('/day/12')" class="w-full glass-panel glass-panel-hover text-white font-bold py-3.5 rounded-2xl text-xs sm:text-sm transition">
                                View Challenge Day 12 ⚡
                            </button>
                        </div>
                    </div>

                    <div class="glass-panel p-6 rounded-[2rem] space-y-4">
                        <h3 class="text-sm font-extrabold text-white uppercase tracking-wider text-center">How It Works</h3>
                        <div class="space-y-3 text-xs text-slate-300">
                            <div class="flex items-start gap-3 bg-slate-950/60 p-3.5 rounded-xl border border-slate-800/80">
                                <span class="text-cyan-400 font-extrabold text-sm">01</span>
                                <p><strong class="text-white">Pick Your Track:</strong> Select AI & Full Stack development tailored for career growth.</p>
                            </div>
                            <div class="flex items-start gap-3 bg-slate-950/60 p-3.5 rounded-xl border border-slate-800/80">
                                <span class="text-indigo-400 font-extrabold text-sm">02</span>
                                <p><strong class="text-white">Build & Commit:</strong> Push code daily to GitHub and share proof on LinkedIn.</p>
                            </div>
                            <div class="flex items-start gap-3 bg-slate-950/60 p-3.5 rounded-xl border border-slate-800/80">
                                <span class="text-emerald-400 font-extrabold text-sm">03</span>
                                <p><strong class="text-white">Get Noticed:</strong> Build absolute consistency and become visible to tech recruiters.</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // 2. STUDENT DASHBOARD (/dashboard)
        function renderDashboard() {
            let daysHtml = '';
            for (let i = 1; i <= 60; i++) {
                const isSelected = appState.selectedCalendarDay === i;
                const isUnlocked = i <= 12;
                
                let btnClasses = "p-2.5 rounded-xl text-[11px] font-bold transition flex flex-col items-center justify-center gap-0.5 border ";
                if (isSelected) {
                    btnClasses += "bg-gradient-to-br from-violet-500 to-indigo-600 text-white border-violet-400 shadow-lg scale-105 z-10 ring-2 ring-violet-400/50";
                } else if (isUnlocked) {
                    btnClasses += "bg-slate-900/90 text-violet-300 border-violet-500/30 hover:bg-slate-800";
                } else {
                    btnClasses += "bg-slate-950/40 text-slate-600 border-slate-900/80 opacity-40 cursor-not-allowed";
                }

                daysHtml += `
                    <button onclick="${isUnlocked ? `selectCalendarDay(${i})` : `showToast('🔒 Day ${i} locked!')`}" class="${btnClasses}">
                        <span>Day ${i}</span>
                        <span class="text-[8px] ${isSelected ? 'text-violet-100' : (isUnlocked ? 'text-emerald-400' : 'text-slate-600')}">${i <= 12 ? '✓ Done' : 'Lock'}</span>
                    </button>
                `;
            }

            return `
                <div class="space-y-5 animate-fadeIn">
                    <div class="bg-gradient-to-r from-amber-500/10 via-amber-500/5 to-transparent border border-amber-500/30 p-4.5 rounded-[1.8rem] flex items-center gap-3.5 backdrop-blur-xl">
                        <span class="text-2xl">🔥</span>
                        <div>
                            <h4 class="text-xs font-extrabold text-amber-400 uppercase tracking-wide">12-Day Active Streak</h4>
                            <p class="text-[10px] text-slate-300 mt-0.5 font-medium">Built late-night post-college. Keep your momentum going!</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <div class="glass-panel p-4 rounded-[1.5rem] text-center">
                            <span class="text-[9px] uppercase font-extrabold text-cyan-400 tracking-wider">Streak</span>
                            <div class="text-xl font-extrabold text-white mt-1">12 <span class="text-[10px] text-slate-400">🔥</span></div>
                        </div>
                        <div class="glass-panel p-4 rounded-[1.5rem] text-center">
                            <span class="text-[9px] uppercase font-extrabold text-indigo-400 tracking-wider">Progress</span>
                            <div class="text-xl font-extrabold text-white mt-1">20%</div>
                        </div>
                        <div class="glass-panel p-4 rounded-[1.5rem] text-center">
                            <span class="text-[9px] uppercase font-extrabold text-emerald-400 tracking-wider">Points</span>
                            <div class="text-xl font-extrabold text-emerald-400 mt-1">600 SP</div>
                        </div>
                    </div>

                    <div class="glass-panel p-5 rounded-[2rem] space-y-3.5">
                        <div class="flex justify-between items-center">
                            <div>
                                <h3 class="text-sm font-extrabold text-white">60-Day Challenge Calendar</h3>
                                <p class="text-[10px] text-slate-400">Inspect completed daily proof of work.</p>
                            </div>
                            <span class="text-[9px] bg-violet-500/10 text-violet-400 border border-violet-500/20 px-2.5 py-1 rounded-full font-bold">Day ${appState.selectedCalendarDay}</span>
                        </div>

                        <div class="grid grid-cols-5 sm:grid-cols-10 gap-2 max-h-56 overflow-y-auto pr-1">
                            ${daysHtml}
                        </div>
                    </div>

                    <div class="glass-panel p-5 rounded-[2rem] border border-violet-500/20 space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-[9px] font-extrabold text-violet-400 uppercase tracking-widest bg-violet-500/10 px-2.5 py-0.5 rounded-full border border-violet-500/20">Selected Day ${appState.selectedCalendarDay} Log</span>
                            <span class="text-[9px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/25 px-2.5 py-0.5 rounded-full font-bold">Verified ✓</span>
                        </div>
                        <h4 class="text-sm font-extrabold text-white">Mobile-First UI Refinement & Integration</h4>
                        <p class="text-slate-300 text-xs leading-relaxed font-medium">
                            Successfully completed responsive mobile layouts at 390px width, verified GitHub commit logs, and posted progress on LinkedIn.
                        </p>
                        <button onclick="router.navigateTo('/day/12')" class="w-full bg-violet-500/10 hover:bg-violet-500/20 text-violet-300 border border-violet-500/30 font-bold py-2.5 rounded-xl text-xs transition">
                            Open Challenge Day 12 Screen →
                        </button>
                    </div>
                </div>
            `;
        }

        // 3. CHALLENGE DAY VIEW (/day/12)
        function renderDayChallenge() {
            return `
                <div class="space-y-5 animate-fadeIn">
                    <div class="flex items-center justify-between">
                        <button onclick="router.navigateTo('/dashboard')" class="text-xs text-slate-400 hover:text-white font-bold">← Dashboard</button>
                        <span class="text-[10px] font-extrabold text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-3 py-1 rounded-full">Day 12 of 60</span>
                    </div>

                    <div class="space-y-2">
                        <span class="text-[9px] font-extrabold text-cyan-400 uppercase tracking-widest">Today's Task</span>
                        <h1 class="text-xl sm:text-3xl font-extrabold text-white tracking-tight">Mobile-First UI Refinement & Integration</h1>
                        <p class="text-xs text-slate-300 leading-relaxed font-medium">
                            Build and verify responsive mobile viewports optimized for 390px screen widths. Ensure readable typography, clean touch targets, and instant feedback loops.
                        </p>
                    </div>

                    <div class="glass-panel p-6 rounded-[2.2rem] space-y-4 shadow-2xl">
                        <h3 class="text-xs font-extrabold text-white uppercase tracking-wider flex items-center justify-between">
                            <span>🚀 Submit Day 12 Proof of Work</span>
                            <span class="text-[9px] text-emerald-400 bg-emerald-500/10 px-2.5 py-0.5 rounded-full">Verified ✓</span>
                        </h3>

                        <div class="space-y-3.5 text-xs">
                            <div>
                                <label class="block text-[9px] font-bold uppercase text-slate-400 mb-1">GitHub Repository URL</label>
                                <input type="text" id="ghInput" value="${appState.githubLink}" oninput="appState.githubLink=this.value" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-cyan-400">
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold uppercase text-slate-400 mb-1">LinkedIn Post URL</label>
                                <input type="text" id="liInput" value="${appState.linkedinLink}" oninput="appState.linkedinLink=this.value" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-cyan-400">
                            </div>
                            
                            <div class="bg-slate-950/90 border border-slate-800 p-3.5 rounded-xl space-y-2">
                                <div class="flex justify-between items-center text-[9px]">
                                    <span class="uppercase font-extrabold text-slate-300">Security Math Check</span>
                                    <button onclick="refreshCaptcha()" class="text-cyan-400 hover:underline font-bold">New Code 🔄</button>
                                </div>
                                <div class="flex items-center gap-3">
                                    <div class="bg-slate-900 border border-slate-700 px-3 py-2 rounded-lg font-mono font-extrabold text-cyan-300">
                                        ${appState.captchaNum1} + ${appState.captchaNum2} = ?
                                    </div>
                                    <input type="number" id="captchaInput" value="${appState.captchaInput}" oninput="appState.captchaInput=this.value" placeholder="Answer" class="w-28 bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-400">
                                </div>
                            </div>
                        </div>

                        <button onclick="handleSubmission()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold py-3 rounded-xl text-xs transition shadow-lg shadow-cyan-500/20">
                            Verify & Submit Proof (+50 SP) ⚡
                        </button>
                    </div>
                </div>
            `;
        }

        // 4. ABOUT US SECTION (/about)
        function renderAbout() {
            return `
                <div class="space-y-6 animate-fadeIn py-2">
                    <div class="text-center space-y-2">
                        <span class="text-[9px] font-bold uppercase tracking-widest text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-3 py-1 rounded-full">About Us • Team Vitality</span>
                        <h1 class="text-2xl font-extrabold text-white tracking-tight">Meet Our Core Team</h1>
                        <p class="text-slate-400 text-xs max-w-sm mx-auto font-medium">The dedicated creators behind the architecture, design, and intelligence of ABTalks.</p>
                    </div>

                    <div class="grid grid-cols-1 gap-4">
                        <div class="glass-panel p-5 rounded-[1.8rem] flex items-center gap-4">
                            <div class="w-10 h-10 rounded-xl bg-pink-500/10 border border-pink-500/25 text-pink-400 flex items-center justify-center font-bold text-base flex-shrink-0">🎨</div>
                            <div>
                                <h3 class="text-sm font-extrabold text-white">Mahima</h3>
                                <p class="text-[9px] text-pink-400 font-extrabold uppercase tracking-widest">Designer</p>
                                <p class="text-slate-400 text-[11px] mt-0.5">Crafted intuitive layouts, visual aesthetics, and mobile responsiveness.</p>
                            </div>
                        </div>

                        <div class="glass-panel p-5 rounded-[1.8rem] flex items-center gap-4">
                            <div class="w-10 h-10 rounded-xl bg-indigo-500/10 border border-indigo-500/25 text-indigo-400 flex items-center justify-center font-bold text-base flex-shrink-0">🤖</div>
                            <div>
                                <h3 class="text-sm font-extrabold text-white">Diksha</h3>
                                <p class="text-[9px] text-indigo-400 font-extrabold uppercase tracking-widest">AI Engineer</p>
                                <p class="text-slate-400 text-[11px] mt-0.5">Engineered intelligent workflows and cutting-edge assistance mechanics.</p>
                            </div>
                        </div>

                        <div class="glass-panel p-5 rounded-[1.8rem] flex items-center gap-4">
                            <div class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/25 text-cyan-400 flex items-center justify-center font-bold text-base flex-shrink-0">💻</div>
                            <div>
                                <h3 class="text-sm font-extrabold text-white">Ishaan</h3>
                                <p class="text-[9px] text-cyan-400 font-extrabold uppercase tracking-widest">Frontend & Backend Developer</p>
                                <p class="text-slate-400 text-[11px] mt-0.5">Developed full-stack architecture, routing mechanics, and application logic.</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // 5. CONTACT US SECTION (/contact)
        function renderContact() {
            return `
                <div class="space-y-5 animate-fadeIn py-2">
                    <div class="text-center space-y-1.5">
                        <span class="text-[9px] font-bold uppercase tracking-widest text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-3 py-1 rounded-full">Get In Touch</span>
                        <h1 class="text-2xl font-extrabold text-white tracking-tight">Contact Team Vitality</h1>
                        <p class="text-slate-400 text-xs font-medium">Have feedback? Rate your experience and drop us a message below.</p>
                    </div>

                    <div class="glass-panel p-6 rounded-[2.2rem] space-y-4 shadow-2xl text-xs">
                        <div class="grid grid-cols-1 gap-3.5">
                            <div>
                                <label class="block text-[9px] font-bold uppercase text-slate-400 mb-1">Your Name</label>
                                <input type="text" placeholder="Enter your name" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-cyan-400">
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold uppercase text-slate-400 mb-1">Email Address</label>
                                <input type="email" placeholder="student@college.edu" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-cyan-400">
                            </div>
                        </div>

                        <!-- Star Rating Option -->
                        <div>
                            <label class="block text-[9px] font-bold uppercase text-slate-400 mb-1">Platform Experience Rating</label>
                            <div class="star-rating flex gap-2 text-2xl" id="starRatingContainer">
                                <span onclick="setRating(1)" class="${appState.selectedRating >= 1 ? 'active' : 'text-slate-600'}">★</span>
                                <span onclick="setRating(2)" class="${appState.selectedRating >= 2 ? 'active' : 'text-slate-600'}">★</span>
                                <span onclick="setRating(3)" class="${appState.selectedRating >= 3 ? 'active' : 'text-slate-600'}">★</span>
                                <span onclick="setRating(4)" class="${appState.selectedRating >= 4 ? 'active' : 'text-slate-600'}">★</span>
                                <span onclick="setRating(5)" class="${appState.selectedRating >= 5 ? 'active' : 'text-slate-600'}">★</span>
                            </div>
                        </div>

                        <div>
                            <label class="block text-[9px] font-bold uppercase text-slate-400 mb-1">Message / Feedback</label>
                            <textarea rows="3" placeholder="How can we help you?" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-cyan-400 resize-none"></textarea>
                        </div>
                        <button onclick="showToast('✅ Feedback & ${appState.selectedRating}-Star Rating sent successfully!')" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold py-3 rounded-xl transition shadow-xl shadow-cyan-500/20">
                            Submit Feedback & Rating ⭐
                        </button>
                    </div>
                </div>
            `;
        }

        function setRating(stars) {
            appState.selectedRating = stars;
            render();
        }

        function selectCalendarDay(day) {
            appState.selectedCalendarDay = day;
            render();
        }

        function refreshCaptcha() {
            appState.captchaNum1 = Math.floor(Math.random() * 6) + 1;
            appState.captchaNum2 = Math.floor(Math.random() * 4) + 1;
            appState.captchaInput = '';
            render();
        }

        function handleSubmission() {
            const gh = document.getElementById('ghInput').value;
            const li = document.getElementById('liInput').value;
            const captchaVal = parseInt(document.getElementById('captchaInput').value);

            if (!gh || !li) {
                showToast('Please provide both GitHub and LinkedIn URLs.');
                return;
            }

            const expectedAnswer = appState.captchaNum1 + appState.captchaNum2;
            if (isNaN(captchaVal) || captchaVal !== expectedAnswer) {
                showToast('❌ Incorrect CAPTCHA answer. Try again.');
                refreshCaptcha();
                return;
            }

            appState.isSubmitted = true;
            appState.streakDays = 12;
            appState.synergyPoints += 50;
            showToast('🎉 Day 12 Verified! +50 SP added.');
            setTimeout(() => router.navigateTo('/dashboard'), 1500);
        }

        function render() {
            const route = router.currentRoute;
            let html = '';
            if (route === '/') html = renderLanding();
            else if (route === '/dashboard') html = renderDashboard();
            else if (route === '/day/12') html = renderDayChallenge();
            else if (route === '/about') html = renderAbout();
            else if (route === '/contact') html = renderContact();
            document.getElementById('app-router').innerHTML = html;

            ['/', '/dashboard', '/day/12', '/about', '/contact'].forEach(r => {
                const btnId = 'nav-' + (r === '/' ? 'home' : (r === '/dashboard' ? 'dashboard' : (r === '/day/12' ? 'day' : (r === '/about' ? 'about' : 'contact'))));
                const btn = document.getElementById(btnId);
                if(btn) {
                    if(r === route) {
                        btn.className = 'px-3 py-1.5 text-xs font-bold rounded-xl transition bg-cyan-500 text-slate-950 shadow-lg shadow-cyan-500/20';
                    } else {
                        btn.className = 'px-3 py-1.5 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white';
                    }
                }
            });
            updateClock();
        }

        window.addEventListener('DOMContentLoaded', () => { router.init(); });
    </script>
</body>
</html>
